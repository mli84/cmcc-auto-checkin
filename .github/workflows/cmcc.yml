name: cmcc

# 全部 cron 用 UTC，注释里标北京时间的对应值。
#   */5 * * * *  心跳：--dry-run 只读续命（app_token 空闲 1~3.5 小时就死，见 README）
#   23 0         每日签到 + 领奖
#   17 1         周三充值日（北京 09:17，秒杀 08:00 场已过，只做任务与拼图）
#   17 1 * * 1   评价有礼（每周一北京 09:17，按周幂等）
#   37 1         兑话费券（北京 09:37，在签到攒豆之后）
#   55 23        假期限时秒杀（北京 07:55，抢 08:00 场）
# 凭证全部走 Secrets，仓库里不落任何明文。
# 话费余额（cmcc_fee）不在 Actions 里跑：jsessionid-cmcc 只有约 180 秒寿命，
# 抓到后必须立刻查，无法在定时任务里无人值守。需要时本地执行。
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "23 0 * * *"
    - cron: "17 1 * * 3"
    - cron: "17 1 * * 1"
    - cron: "37 1 * * *"
    - cron: "55 23 * * *"
  workflow_dispatch:

# 同一账号并发会互踢会话，所有任务串行
concurrency:
  group: cmcc-session
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 只传必需项：代码里 env.get(key, 默认值) 无法区分「未设置」与「空串」，
  # 传空串会把 activity_id/channel_id 的默认值覆盖成空，导致活动页 404。
  CMCC_APP_TOKEN: ${{ secrets.CMCC_APP_TOKEN }}
  CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
  CMCC_PROVINCE_CODE: ${{ secrets.CMCC_PROVINCE_CODE }}
  CMCC_CITY_CODE: ${{ secrets.CMCC_CITY_CODE }}
  CMCC_BARK_URL: ${{ secrets.CMCC_BARK_URL }}

jobs:
  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python cmcc_sign.py --dry-run

  sign:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 凭证预检
        run: |
          if [ -z "$CMCC_APP_TOKEN" ] || [ -z "$CMCC_PHONE" ]; then
            echo "::error::缺少 Secret：请配置 CMCC_APP_TOKEN 与 CMCC_PHONE"
            exit 1
          fi
          echo "凭证已配置：token ${#CMCC_APP_TOKEN} 字符，手机尾号 ${CMCC_PHONE: -4}"
      - run: python cmcc_sign.py --tasks --games --seed --wed --gold --delay 600

  wed:
    if: github.event.schedule == '17 1 * * 3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python cmcc_wed.py

  rate:
    if: github.event.schedule == '17 1 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python cmcc_rate.py --exchange

  gold:
    if: github.event.schedule == '37 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python cmcc_gold.py

  seckill:
    if: github.event.schedule == '55 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      # 无场次的非活动日会退出 1，属预期，不让整个 workflow 变红
      - run: python cmcc_seckill.py
        continue-on-error: true
